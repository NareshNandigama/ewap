# Entirely isolated local stack; no host database/broker ports or paid model keys.
name: ewap-local
services:
  tls:
    image: pgvector/pgvector:pg16
    entrypoint: ['sh', '/scripts/init-tls.sh']
    volumes:
      - local-tls:/tls
      - ./docker/local/init-tls.sh:/scripts/init-tls.sh:ro

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ewap_local
      POSTGRES_USER: ewap_local
      POSTGRES_PASSWORD: ${EWAP_DB_PASSWORD:?Run node scripts/local-stack.mjs init}
    command:
      [
        'postgres',
        '-c',
        'ssl=on',
        '-c',
        'ssl_cert_file=/tls/postgres.crt',
        '-c',
        'ssl_key_file=/tls/postgres.key',
        '-c',
        'hba_file=/etc/postgresql/local-pg_hba.conf',
      ]
    depends_on:
      tls:
        condition: service_completed_successfully
    volumes:
      - local-postgres:/var/lib/postgresql/data
      - local-tls:/tls:ro
      - ./docker/local/pg_hba.conf:/etc/postgresql/local-pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ewap_local -d ewap_local']
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ewap_local
      RABBITMQ_DEFAULT_PASS: ${EWAP_BROKER_PASSWORD:?Run local-stack init}
    volumes:
      - local-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - local-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./api
      target: builder
    environment:
      LOCAL_ADMIN_EMAIL: ${EWAP_LOCAL_EMAIL:-local-admin@example.invalid}
      LOCAL_ADMIN_PASSWORD: ${EWAP_LOCAL_PASSWORD:?Run local-stack init}
      DATABASE_URL: postgresql://ewap_local:${EWAP_DB_PASSWORD}@postgres:5432/ewap_local?sslmode=require&sslaccept=strict&sslcert=/tls/ca.crt
    command: ['yarn', 'prisma', 'migrate', 'deploy']
    volumes:
      - local-tls:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: production
    entrypoint: ['sh', '/scripts/node-entrypoint.sh', 'node', 'dist/main.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewap_local
      DB_USER: ewap_local
      DB_PASSWORD: ${EWAP_DB_PASSWORD}
      DB_SSL_MODE: verify-full
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      JWT_SECRET: ${EWAP_JWT_SECRET:?Run local-stack init}
      FRONTEND_URL: ${EWAP_PUBLIC_ORIGIN:-http://localhost:${EWAP_WEB_PORT:-18080}}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_ENABLED: 'true'
      ENABLE_MESSAGING: 'true'
      RABBITMQ_URL: amqp://ewap_local:${EWAP_BROKER_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE: workflow-execution
      WORKER_STATUS_API_KEY: ${EWAP_WORKER_KEY:?Run local-stack init}
      AI_DIAGNOSTICS_URL: https://gateway:8443
      AI_SERVICE_API_KEY: ${EWAP_AI_KEY:?Run local-stack init}
      GEMINI_API_KEY: local-placeholder-no-provider-calls
    volumes:
      - local-tls:/tls:ro
      - ./docker/local/node-entrypoint.sh:/scripts/node-entrypoint.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ai-service:
    build:
      context: ./ai-service
      target: runtime
    environment:
      AI_SERVICE_API_KEY: ${EWAP_AI_KEY}
      AI_ANALYSIS_MODE: deterministic
    read_only: true
    tmpfs: [/tmp]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_WEBSOCKET_URL: ${EWAP_PUBLIC_ORIGIN:-http://localhost:${EWAP_WEB_PORT:-18080}}
    environment:
      EWAP_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=64m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    image: nginx:alpine
    entrypoint: ['nginx', '-g', 'daemon off;']
    ports:
      - '127.0.0.1:${EWAP_WEB_PORT:-18080}:8080'
      - '127.0.0.1:${EWAP_TLS_PORT:-18443}:8443'
    volumes:
      - local-tls:/tls:ro
      - ./docker/local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    entrypoint: ['sh', '/scripts/node-entrypoint.sh', 'node', 'dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ewap_local:${EWAP_DB_PASSWORD}@postgres:5432/ewap_local
      DB_SSL_MODE: verify-full
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      RABBITMQ_URL: amqp://ewap_local:${EWAP_BROKER_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE: workflow-execution
      WORKER_API_BASE_URL: https://gateway:8443
      WORKER_STATUS_API_KEY: ${EWAP_WORKER_KEY}
    volumes:
      - local-tls:/tls:ro
      - ./docker/local/node-entrypoint.sh:/scripts/node-entrypoint.sh:ro
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]

volumes:
  local-postgres:
  local-rabbitmq:
  local-redis:
  local-tls:
