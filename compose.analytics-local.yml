# Isolated analytics test database. Never point these tests at an application DB.
name: ewap-analytics-local
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ewap_analytics_test
      POSTGRES_USER: analytics_owner
      POSTGRES_PASSWORD: ${ANALYTICS_TEST_PASSWORD:?Set ANALYTICS_TEST_PASSWORD in an ignored environment file}
    ports:
      - "127.0.0.1:${ANALYTICS_TEST_PORT:-15432}:5432"
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_owner -d ewap_analytics_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  analytics-data:
