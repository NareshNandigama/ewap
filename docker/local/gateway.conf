server {
    listen 8080;
    listen 8443 ssl;
    server_name localhost gateway;
    ssl_certificate /tls/gateway.crt;
    ssl_certificate_key /tls/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location /api/v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 65s;
    }
    location /v1/diagnostics/ {
        proxy_pass http://ai-service:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
    }
    location = /python-health {
        proxy_pass http://ai-service:8001/health;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
    }
}
