name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: ${{ matrix.app }} tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Generate Prisma client
        if: matrix.app != 'web'
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: yarn prisma generate
      - name: Lint
        run: yarn lint
      - name: Unit tests
        if: matrix.app != 'web'
        run: yarn test
      - name: MCP stdio regression
        if: matrix.app == 'api'
        run: node --test scripts/mcp-server.test.mjs
      - name: Streaming regression
        if: matrix.app == 'web'
        run: node --test scripts/ai-stream.test.mjs
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: yarn build

  python:
    name: FastAPI tests and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.lock
      - name: Install runtime lock and test tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -c requirements.lock -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Build source distribution and wheel
        run: python -m build

  compose:
    name: Full-stack Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Start isolated local stack
        run: |
          node scripts/local-stack.mjs init
          node scripts/local-stack.mjs check
          node scripts/local-stack.mjs up
      - name: Verify registration, workflow execution, and runbook diagnostics
        run: |
          node scripts/local-stack.mjs account
          node scripts/local-stack.mjs smoke
      - name: Show service states on failure
        if: failure()
        run: node scripts/local-stack.mjs status
      - name: Stop local stack
        if: always()
        run: |
          if [[ -f .env.stack-local ]]; then
            node scripts/local-stack.mjs down
          fi

  verified:
    name: EWAP CI passed
    if: always()
    needs: [javascript, python, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
